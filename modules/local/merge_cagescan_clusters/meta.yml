name: merge_cagescan_clusters
description: "Merge per-sample CAGEscan clusters into FANTOM5-style meta-clusters (union of blocks, score = number of samples)"
keywords:
  - cage
  - cagescan
  - bed
tools:
  - python:
      description: Python 3 script from the pipeline bin/ directory
      homepage: https://www.python.org
      licence:
        - "PSF"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1' ]
    - bed12:
        type: file
        description: "Per-sample CAGEscan cluster BED12 files"
        pattern: "*.cagescan_clusters.bed12"
output:
  bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1' ]
      - "*.cagescan_clusters.bed12":
          type: file
          description: "Meta-clusters"
          pattern: "*.cagescan_clusters.bed12"
authors:
  - "@johannesnicolaus"
maintainers:
  - "@johannesnicolaus"
